- title: Research Experience
  type: time_table
  contents:
    - title: Data Science Consultant, Open Syllabus Project
      institution: VitalSource Technologies
      year: Aug 2026 - Present
      description:
        - "**AI Policy Research**: Lead the study of how AI-use policies in academic syllabi have changed over time, owning the data and analysis work end to end toward a public dashboard for students, universities, and journalists."
        - "**Language Model Data Quality**: Turned 32.9M unstructured syllabi into a structured, publishable dataset for $66 against a $220 to $650 budget. Hash-based deduplication cut the language model workload by 84%, and four automated quality gates held output validity at 99.2% and run-to-run agreement at κ 0.87 to 0.95."
        - "**Corpus Expansion**: Added a new data source to the 33.5M-syllabus production corpus, loading 1.67M documents (1.54 TB) after profiling about 894M rows of crawl metadata and finding 1.58M cloud-hosted files the crawlers had missed. Built fault-tolerant ingestion across four cloud storage APIs that raised throughput 25 to 35x and cut a projected 56-day backlog to 2.6 days."
        - "**Pipeline Monitoring**: Found that 53% of crawl jobs marked successful returned no data, by archiving and analyzing 1,197 jobs from a pipeline that had no monitoring. Built health rules and automated alerts that now flag stalled crawls within 40 minutes instead of 30 days."

    - title: Data Research Specialist (AI/ML), LAiSER
      institution: George Washington University, Washington, D.C.
      department: Program on Skills, Credentials and Workforce Policy, Institute of Public Policy
      year: Apr 2024 - Jul 2026
      description:
        - "**LLM Pipeline Scaling**: Built and scaled LLM extraction pipelines across 1M+ records using vLLM; improved inference throughput 7x, cutting end-to-end processing time from 2 months to 8 days for empirical research workflows."
        - "**LLM API Integration**: Integrated Gemini API into LAiSER for multi-model evaluation workflows; designed abstraction layers to support rapid experimentation across different LLM providers."
        - "**Retrieval Performance**: Implemented FAISS-based semantic search and optimized retrieval, delivering a consistent 30% speed improvement for retrieval-augmented research workflows."
        - "**Workforce Analysis**: Developed Neo4j and Plotly visualizations to identify skill gaps across 1,000+ courses and provided recommendations on two local training policies for the Texas Workforce Commission."
        - "**Open-source Engineering**: Primary maintainer of LAiSER GitHub organization (multiple repos) with a team of 7; drove architecture decisions, reusable libraries, and rapid iteration to support reproducible research. Received the 2025 GW OSPO open-source student award for LAiSER."
        - "**Release Quality & DevSecOps**: Led releases for 4+ major versions using GitHub Actions; added CodeQL and Dependabot for automated scanning and alerts; standardized Conventional Commits and Semantic Versioning for transparent collaboration."
        - "**Research Communication**: Worked with non-technical partners to explain design choices and trade-offs; supported $1M in grant-funded research with the Walmart Foundation and the Gates Foundation, applying NIST AI RMF for risk management."

